services:
  invoice-generator:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DATA_DIR: /data
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - invoice-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  invoice-data:
